<!DOCTYPE html>
<html>
  <head>
    <title>2D game thing</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
      <canvas id="myCanvas" width="1000" height="500" style="border:5px solid black;">
</canvas>
      <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        function draw2d(color, offsetX, offsetY, sizeX, sizeY) {
          ctx.fillStyle = color;
          ctx.fillRect(offsetX, offsetY, sizeX, sizeY);
          return
        }
       
        //lava stuff
        draw2d("red", 125, 495, 500, 9)
       
        //platforms
        draw2d("gray", 100, 460, 70, 9)
        draw2d("gray", 200, 420, 70, 9)
        draw2d("gray", 100, 460, 70, 9)
        draw2d("gray", 100, 460, 70, 9)
        draw2d("gray", 100, 460, 70, 9)
       
        //player
        draw2d("green", 20, 400, 30, 30)
      </script>
  </body>
</html>
